<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grooveboix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            /* General Palette */
            --color-shadow: rgba(0,0,0,0.2);
            --font-primary: "Share Tech Mono", monospace;
            --color-screen-bg: #2A2420;
            --color-led-flash: #fffbe0;

            /* Grooveboix Palette */
            --color-beige-light: #F5F5DC;
            --color-beige-dark: #d7cfb8;
            --color-text-on-beige: #5C5046;
            --color-accent-purple: #9590A8;
            --color-accent-mauve: #B38D97;
            --color-play-red: #C73E1D;
            --color-play-red-dark: #A22C0F;
            --color-led-off: rgba(149, 144, 168, 0.5);
            --color-led-on-l1: var(--color-accent-mauve);
            --color-led-glow-l1: rgba(179, 141, 151, 0.5);
            --color-led-on-l2: var(--color-accent-purple);
            --color-led-glow-l2: rgba(149, 144, 168, 0.5);
            --color-led-edit-mode: #f7b733;
            --color-led-edit-mode-glow: rgba(247, 183, 51, 0.5);
            --color-screen-text: var(--color-accent-purple);

            /* Drumboink Palette */
            --color-brown-light: #A0785A;
            --color-brown-dark: #6F4E37;
            --color-text-on-brown: #F5EFE6;
            --color-accent-orange: #E89F73;
            --color-led-drum: var(--color-accent-orange);
            --color-led-drum-glow: rgba(232, 159, 115, 0.5);
            --color-led-fill: #4ade80;
            --color-led-fill-glow: rgba(74, 222, 128, 0.5);
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background-color: #3b322c;
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            font-family: var(--font-primary);
            font-size: 14px;
            display: flex;
            justify-content: center;
            padding-top: 20vh; /* Pushed down from the top */
        }

        #studio-wrapper {
            transform: scale(0.65); /* Scaled down the whole setup */
            transform-origin: top center;
            position: relative;
        }

        #studio-setup {
            display: flex;
            gap: 24px;
            align-items: flex-end;
            position: relative;
        }

        .device-case {
            border-radius: 6px;
            padding: 12px;
            border: 1px solid #7a7165;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            display: flex;
        }

        .device-body {
            border-radius: 4px;
            display: flex;
            gap: 12px;
            padding: 12px;
            border-top: 1px solid rgba(255,255,255,0.8);
            border-left: 1px solid rgba(255,255,255,0.8);
            box-shadow: inset 2px 2px 5px var(--color-shadow);
            width: 100%;
            min-height: 0;
            min-width: 0;
        }
        
        #grooveboix-root {
            background-color: var(--color-beige-dark);
            flex-direction: column;
            width: 1100px;
            height: 500px; /* Restored slimmer look */
        }
        #grooveboix-body {
            background-color: var(--color-beige-light);
            color: var(--color-text-on-beige);
            flex-direction: row;
            flex-grow: 1;
        }

        #drumbuddy-root {
            background-color: var(--color-brown-dark);
            flex-direction: column;
            width: 320px;
            height: 450px;
        }
        
        #drumbuddy-body {
             background-color: var(--color-brown-light);
             color: var(--color-text-on-brown);
             flex-direction: column;
        }

        /* General button styles */
        .control-btn {
            border: 2px solid;
            border-radius: 4px;
            letter-spacing: 0.05em;
            padding: 0.3rem;
            text-transform: uppercase;
            transition: all 0.1s ease;
            box-shadow: 1px 1px 2px var(--color-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .control-btn:active, .control-btn.active-copy {
            box-shadow: inset 1px 1px 2px var(--color-shadow);
            transform: translateY(1px);
        }
        
        /* Grooveboix Buttons */
        .grooveboix-btn {
            background-color: var(--color-beige-light);
            border-color: var(--color-text-on-beige);
            color: var(--color-text-on-beige);
        }
        .grooveboix-btn:hover { background-color: #d7cfb8; }
        .grooveboix-btn.active {
            background-color: var(--color-text-on-beige);
            color: var(--color-beige-light);
        }
        
        /* Drumboink Buttons */
        .drumbuddy-btn {
            background-color: var(--color-brown-light);
            border-color: var(--color-text-on-brown);
            color: var(--color-text-on-brown);
        }
        .drumbuddy-btn:hover { background-color: #b98c6e; }
        .drumbuddy-btn.active {
            background-color: var(--color-accent-orange);
            color: var(--color-screen-bg);
            border-color: var(--color-led-drum-glow);
        }

        #start-stop-btn {
            width: 60px; height: 60px; border-radius: 50%;
            background-color: var(--color-text-on-beige);
            border: 3px solid var(--color-beige-dark);
            box-shadow: 0 3px 0 var(--color-shadow);
        }
        #start-stop-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--color-shadow); }
        #start-stop-btn svg { fill: var(--color-beige-light); width: 1.5rem; height: 1.5rem; }
        #start-stop-btn.playing { background-color: var(--color-play-red); box-shadow: 0 3px 0 var(--color-play-red-dark); }
        #start-stop-btn.playing svg { fill: var(--color-beige-light); }
        
        .bpm-control-wrapper {
            background-color: var(--color-beige-dark); border-radius: 4px;
            padding: 4px; box-shadow: inset 2px 2px 4px var(--color-shadow);
        }
        .bpm-display {
            background-color: var(--color-beige-light); box-shadow: inset 1px 1px 2px var(--color-shadow);
            border-radius: 2px; color: var(--color-text-on-beige);
            font-size: 1.8rem; width: 4rem; text-align: center;
        }
        
        .retro-screen {
            background-color: var(--color-screen-bg); padding: 8px;
            border-radius: 3px; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5);
        }
        .panel-title {
            text-align: center; text-transform: uppercase; letter-spacing: 0.1em;
            font-size: 0.65rem; margin-bottom: 4px;
            white-space: nowrap;
        }
        #grooveboix-root .panel-title { color: var(--color-text-on-beige); }
        #grooveboix-root .grid-label { color: var(--color-screen-text); }
        #drumbuddy-root .panel-title { color: var(--color-text-on-brown); }

        /* Grid styles */
        .main-content-area {
            display: flex; flex-direction: column; flex-grow: 1;
            min-width: 0; min-height: 0; gap: 8px;
        }
        .grid-wrapper { 
            display: flex; flex-direction: column; flex-grow: 1; min-height: 0;
        }
        .grid-scroll-container { overflow: hidden; flex-grow: 1; min-height: 0; }
        .grid-container { 
            display: grid; gap: 4px; padding: 4px; height: 100%;
        }
        #grooveboix-grid-container { grid-template-columns: repeat(32, 1fr); grid-template-rows: repeat(16, 1fr); }
        
        .labels-container {
            display: grid; gap: 4px; padding: 0 4px 4px 4px; flex-shrink: 0;
        }
        #grooveboix-labels { grid-template-columns: repeat(32, 1fr); }

        .grid-label {
            display: flex; align-items: center; justify-content: center;
            font-size: 0.6rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        
        .grid-cell {
            border-radius: 4px; cursor: pointer; position: relative; overflow: hidden;
            background-color: var(--color-led-off);
            transition: background-color 0.1s ease-out, box-shadow 0.2s ease-out;
            width: 100%; padding-bottom: 100%; height: 0;
        }
        .grid-cell.active-l1, .grid-cell.active-edit.active-l1 { background-color: var(--color-led-on-l1); box-shadow: 0 0 8px var(--color-led-glow-l1); }
        .grid-cell.active-l2, .grid-cell.active-edit.active-l2 { background-color: var(--color-led-on-l2); box-shadow: 0 0 8px var(--color-led-glow-l2); }
        .grid-cell.active-edit { background-color: var(--color-led-edit-mode); box-shadow: 0 0 8px var(--color-led-edit-mode-glow); }
        
        .grid-cell.triggered-l1, .grid-cell.triggered-drum { animation: trigger-pulse-l1 0.2s ease-out; }
        .grid-cell.triggered-l2 { animation: trigger-pulse-l2 0.2s ease-out; }
        
        @keyframes trigger-pulse-l1 {
            0% { background-color: var(--color-led-flash); box-shadow: 0 0 12px var(--color-led-flash); }
            100% { background-color: var(--color-led-on-l1); box-shadow: 0 0 8px var(--color-led-glow-l1); }
        }
        @keyframes trigger-pulse-l2 {
            0% { background-color: var(--color-led-flash); box-shadow: 0 0 12px var(--color-led-flash); }
            100% { background-color: var(--color-led-on-l2); box-shadow: 0 0 8px var(--color-led-glow-l2); }
        }
        
        .song-block-container { 
            display: grid; grid-template-columns: repeat(2, 1fr); 
            grid-template-rows: repeat(8, 1fr); gap: 4px; 
        }
        .song-block {
            background-color: var(--color-led-off); border: 2px solid transparent;
            color: var(--color-screen-text); font-weight: 700; height: 100%;
            border-radius: 2px; cursor: pointer; transition: all 0.2s ease; min-height: 25px;
        }
        .song-block.filled { background-color: var(--color-accent-purple); opacity: 0.6; }
        .song-block:hover { border-color: var(--color-led-on-l1); }
        .song-block.active {
            background-color: var(--color-led-on-l1); border-color: var(--color-led-on-l1);
            color: var(--color-screen-bg); text-shadow: 0 0 5px var(--color-screen-bg); opacity: 1;
        }
        
        #edit-rhythm-btn.active {
             background-color: var(--color-led-edit-mode); color: var(--color-screen-bg);
             border-color: var(--color-led-edit-mode-glow);
        }
        
        .control-strip-horizontal {
            flex-shrink: 0; background: var(--color-beige-dark); padding: 8px;
            border-radius: 4px; box-shadow: inset 2px 2px 4px var(--color-shadow);
        }
        
        /* Drumboink Specifics */
        #drumbuddy-main-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }
        #drumbuddy-pattern-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 8px;
            flex-grow: 1;
        }
        .drum-pattern-btn {
            height: 40px;
            font-size: 0.7rem;
            padding: 0.2rem;
        }
        #drumbuddy-fill-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 0 8px 8px 8px;
        }
        .fill-btn {
            height: 40px;
            font-size: 1rem;
        }
        .fill-btn:active {
            background-color: var(--color-led-fill);
            color: var(--color-screen-bg);
            border-color: var(--color-led-fill-glow);
        }

        /* Sync Cable */
        #sync-cable {
            position: absolute;
            bottom: 20px;
            left: 100%;
            width: 40px;
            height: 25px;
            margin-left: -28px;
            border: 3px solid #333;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            border-bottom: none;
            z-index: -1;
        }
        
        /* Coffee Cup */
        #coffee-cup-container {
            position: absolute;
            top: -250px; /* Moved up */
            right: -80px;
            z-index: 10;
        }
        #saucer {
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, #e0e0e0 0%, #f6f6f6 70%);
            border-radius: 50%;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2), inset 1px 1px 3px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #cup {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, #ffffff 85%, #e0e0e0 100%);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.15);
        }
        #cup::after { /* Handle */
            content: "";
            position: absolute;
            right: -30px;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 80px;
            border: 15px solid #ffffff;
            border-left-width: 10px;
            border-right-width: 10px;
            border-radius: 50%;
            box-shadow: -1px 2px 5px rgba(0,0,0,0.1);
        }
        #coffee {
            width: 125px;
            height: 125px;
            background: radial-gradient(circle, #e19d57 0%, #D28C40 40%);
            border-radius: 50%;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div id="studio-wrapper">
    <div id="coffee-cup-container">
        <div id="saucer">
            <div id="cup">
                <div id="coffee"></div>
            </div>
        </div>
    </div>

    <div id="studio-setup">
        <!-- DRUMBOINK -->
        <div id="drumbuddy-root" class="device-case">
            <div id="drumbuddy-body" class="device-body">
                <h1 class="panel-title text-lg" style="color: var(--color-text-on-brown);">DRUMBOINK</h1>
                <div id="drumbuddy-main-panel" class="retro-screen">
                    <div id="drumbuddy-pattern-buttons">
                        <!-- Drum pattern buttons will be generated here -->
                    </div>
                    <div class="flex flex-col">
                        <h2 class="panel-title text-xs" style="color: var(--color-text-on-brown); margin-bottom: 0;">FILL-INS</h2>
                        <div id="drumbuddy-fill-buttons">
                            <!-- Fill buttons will be generated here -->
                        </div>
                    </div>
                </div>
                <div id="sync-cable"></div>
            </div>
        </div>

        <!-- GROOVEBOIX -->
        <div id="grooveboix-root" class="device-case">
            <div class="flex items-center justify-between px-2">
                <div class="control-strip-horizontal flex items-center gap-4">
                    <div class="flex items-center gap-2">
                        <span class="panel-title mb-0" style="color: var(--color-screen-text);">Layer</span>
                        <div id="layer-controls" class="inline-flex gap-2"></div>
                    </div>
                    <button id="edit-rhythm-btn" class="control-btn grooveboix-btn text-xs">Bewerk Ritmes</button>
                    <div class="flex items-center gap-2">
                        <span class="panel-title mb-0" style="color: var(--color-screen-text);">L1 Wave</span>
                        <div id="waveform-controls-l1" class="inline-flex gap-1"></div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="panel-title mb-0" style="color: var(--color-screen-text);">L2 Wave</span>
                        <div id="waveform-controls-l2" class="inline-flex gap-1"></div>
                    </div>
                </div>
                <h1 class="panel-title text-2xl pt-2 text-right">GROOVEBOIX</h1>
            </div>
            <div id="grooveboix-body" class="device-body">
                <!-- Vertical Control Strip -->
                <div class="flex flex-col gap-2 p-2 w-48 flex-shrink-0">
                    <div class="flex items-center justify-between gap-2 mb-2">
                        <button id="start-stop-btn" class="control-btn">
                            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
                        </button>
                        <div class="flex items-center gap-1 bpm-control-wrapper">
                            <button id="bpm-down-btn" class="control-btn grooveboix-btn bpm-btn">-</button>
                            <div id="bpm-display" class="bpm-display">120</div>
                            <button id="bpm-up-btn" class="control-btn grooveboix-btn bpm-btn">+</button>
                        </div>
                    </div>
                    <div class="flex flex-col items-center gap-1 p-1 flex-grow">
                        <span class="panel-title">Toonladder</span>
                        <div id="scale-type-controls" class="inline-flex flex-wrap justify-center gap-2"></div>
                        <div id="root-note-controls" class="grid grid-cols-2 gap-1 mt-1 w-full"></div>
                    </div>
                </div>

                <!-- Main Content Area (Grid) -->
                <div class="main-content-area">
                    <div class="grid-wrapper retro-screen">
                        <div id="grooveboix-labels" class="labels-container"></div>
                        <div class="grid-scroll-container">
                            <div id="grooveboix-grid-container" class="grid-container"></div>
                        </div>
                    </div>
                    <!-- Controls moved to the header -->
                </div>

                <!-- Pattern Strip -->
                <div class="flex flex-col gap-2 w-28 flex-shrink-0">
                    <div class="p-2 flex flex-col gap-2 retro-screen flex-grow min-h-0">
                        <h2 class="panel-title text-center" style="color: var(--color-screen-text);">Patronen</h2>
                        <div id="song-mode-container" class="song-block-container"></div>
                    </div>
                    <button id="copy-btn" class="control-btn grooveboix-btn mode-btn text-xs w-full">Kopieer</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    // --- GLOBAL STATE & CONTROLS ---
    let isEngineOn = false;
    let isPlaying = false;
    const startStopBtn = document.getElementById('start-stop-btn');
    const bpmDisplay = document.getElementById('bpm-display');
    const bpmUpBtn = document.getElementById('bpm-up-btn');
    const bpmDownBtn = document.getElementById('bpm-down-btn');

    // --- GROOVEBOIX SETUP ---
    const grooveboix = {
        grid: document.getElementById('grooveboix-grid-container'),
        labels: document.getElementById('grooveboix-labels'),
        rootNoteControls: document.getElementById('root-note-controls'),
        scaleTypeControls: document.getElementById('scale-type-controls'),
        waveformControlsL1: document.getElementById('waveform-controls-l1'),
        waveformControlsL2: document.getElementById('waveform-controls-l2'),
        layerControls: document.getElementById('layer-controls'),
        songModeContainer: document.getElementById('song-mode-container'),
        copyBtn: document.getElementById('copy-btn'),
        editRhythmBtn: document.getElementById('edit-rhythm-btn'),
        
        NUM_NOTES: 32, NUM_RHYTHMS: 16, NUM_STEPS: 32,
        ALL_NOTES: ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'],
        SCALE_TYPES: { 'Majeur': [0, 2, 4, 5, 7, 9, 11], 'Mineur': [0, 2, 3, 5, 7, 8, 10] },
        WAVEFORMS: ['square', 'sawtooth', 'triangle', 'sine'],
        WAVEFORM_ICONS: {
            'square': '<svg viewBox="0 0 24 24"><path d="M2 12h6v-8h8v8h6"></path></svg>',
            'sawtooth': '<svg viewBox="0 0 24 24"><path d="M2 20l10-16v16l10-16"></path></svg>',
            'triangle': '<svg viewBox="0 0 24 24"><path d="M2 12l5-10l5 10l5-10l5 10"></path></svg>',
            'sine': '<svg viewBox="0 0 24 24"><path d="M2 12c2-10 6-10 8 0s6 10 8 0"></path></svg>'
        },
        activeParts: { 0: {}, 1: {} },
        currentNotes: [], currentRoot: 'C', currentScale: 'Majeur',
        layerWaveforms: ['square', 'triangle'], currentLayer: 0,
        songBlocks: Array(16).fill(null).map(() => ({ 0: null, 1: null })),
        activeBlockIndex: -1, appMode: 'normal', copyBuffer: null,
        RHYTHM_PATTERNS: [
            '________X_______________X_______', '____X___________X_______________',
            'X_______________X_______________', '____X_______X_______X_______X___',
            'X_______X_______X_______X_______', '__X___X___X___X___X___X___X___X_',
            'X___X___X___X___X___X___X___X___', 'X_X_X___X_X_X___X_X_X___X_X_X___',
            'X_X_X_X_X_X_X_X_X_X_X_X_X_X_X_X_', 'X__X__X__X__X__XX__X__X__X__X__X',
            '__X_X_X_X_X_X_X___X_X_X_X_X_X_X_', 'X_X__X_X__X_X___X_X__X_X__X_X___',
            'X_XX_X__X_XX_X__X_XX_X__X_XX_X__', 'XXX_XXX_XXX_XXX_XXX_XXX_XXX_XXX_',
            'X_XX_X_XX_X_XX_X_XX_X_XX_X_XX_X_', 'XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX',
        ],
        synths: [],
        reverb: new Tone.Reverb(0.5).toDestination()
    };
    grooveboix.synths = [
        new Tone.PolySynth(Tone.Synth, { oscillator: { type: 'square' } }).connect(grooveboix.reverb),
        new Tone.PolySynth(Tone.Synth, { oscillator: { type: 'triangle' } }).connect(grooveboix.reverb)
    ];

    // --- DRUMBOINK SETUP ---
    const drumboink = {
        buttonsContainer: document.getElementById('drumbuddy-pattern-buttons'),
        fillsContainer: document.getElementById('drumbuddy-fill-buttons'),
        SOUNDS: {
            'KICK': new Tone.MembraneSynth({ pitchDecay: 0.06, octaves: 6, oscillator: { type: 'sine' }, envelope: { attack: 0.001, decay: 0.3, sustain: 0.01, release: 0.2 } }).toDestination(),
            'SNAR': new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.15, sustain: 0, release: 0.1 } }).toDestination(),
            'HATC': new Tone.NoiseSynth({ noise: { type: 'brown' }, envelope: { attack: 0.005, decay: 0.03, sustain: 0, release: 0.05 } }).toDestination(),
            'HATO': new Tone.NoiseSynth({ noise: { type: 'brown' }, envelope: { attack: 0.005, decay: 0.4, sustain: 0, release: 0.1 } }).toDestination(),
            'CLAP': new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.08, sustain: 0.05, release: 0.1 } }).toDestination(),
            'TOM': new Tone.MembraneSynth({ pitchDecay: 0.08, octaves: 4, oscillator: { type: 'triangle' }, envelope: { attack: 0.001, decay: 0.4, sustain: 0.01, release: 0.2 } }).toDestination(),
        },
        PATTERNS: {
            'POP': {'KICK': 'X___X___X___X___', 'SNAR': '____X_______X___', 'HATC': 'X_X_X_X_X_X_X_X_'},
            'ROCK': {'KICK': 'X__XX__X____X__X', 'SNAR': '____X_______X___', 'HATC': 'X_X_X_X_X_X_X_X_'},
            'BOSSA': {'KICK': 'X__X____X__X____', 'SNAR': '__X__X_X__X__X_X', 'HATC': 'X_X_X_X_X_X_X_X_'},
            'FUNK': {'KICK': 'X__XX_X____X_X__', 'SNAR': '____X_______X___', 'HATO': '__X__XX_X__X__X_'},
            'TECHNO': {'KICK': 'X___X___X___X___', 'CLAP': '____X_______X___', 'HATO': '__X___X___X___X_'},
            'HOUSE': {'KICK': 'X___X___X___X___', 'CLAP': '____X_______X___', 'HATO': 'X_X__X__X_X__X__'},
            'HIPHOP': {'KICK': 'X_____X_X_______', 'SNAR': '____X_______X___', 'HATC': 'X_XXX_X_X_XXX_X_'},
            'REGGAE': {'KICK': '____X_______X___', 'SNAR': '____X_______X___', 'HATC': '__X___X___X___X_'},
            'DISCO': {'KICK': 'X___X___X___X___', 'HATO': 'X_X_X_X_X_X_X_X_', 'SNAR': '____X_______X___'},
            'BREAK': {'KICK': 'X__X__X____X____', 'SNAR': '____X___X_X_X___', 'HATC': 'X_X_X_X_X_X_X_X_'},
            'SWING': {'KICK': 'X____X____X____X', 'HATC': 'X_XX_XX_XX_XX_X_', 'SNAR': '____X_______X___'},
            'AFRO': {'KICK': 'X__X____X__X____', 'TOM': '______X__X____X_', 'SNAR': '____X_______X___'},
            'LATIN': {'KICK': 'X__X____X__X____', 'TOM': '______X_X___X__X', 'HATC': 'X_X_X_X_X_X_X_X_'},
            'METAL': {'KICK': 'X_X_X_X_X_X_X_X_', 'SNAR': '____X_______X___', 'HATO': 'X_X_X_X_X_X_X_X_'},
            'DNB': {'KICK': 'X_____X___X___X_', 'SNAR': '____X_______X___', 'HATO': 'X_X_XX_XX_X_XX_X'},
            'BALLAD': {'KICK': 'X___________X___', 'SNAR': '____X___________', 'HATC': 'X_X_X_X_X_X_X_X_'}
        },
        FILLS: {
            'FILL 1': {'SNAR': 'X_X_X_X_XXXXXXXX'},
            'FILL 2': {'TOM': 'X_X_X_X_X_X_X_X_'},
            'FILL 3': {'KICK': 'XXXXXXXXXXXXX_X_', 'SNAR': '____X_______X___'},
            'FILL 4': {'CLAP': 'X_XX_XX_XXXXXXXX'}
        },
        sequence: null, activePattern: null,
        fillQueued: null, fillStepCounter: -1,
    };
    Object.values(drumboink.SOUNDS).forEach(s => s.volume.value = -6);

    // --- GLOBAL PLAYBACK & ANIMATION ---
    function animateCellTrigger(el, device) {
        let triggerClass = (device === 'grooveboix') ? (grooveboix.currentLayer === 0 ? 'triggered-l1' : 'triggered-l2') : 'triggered-drum';
        el.classList.add(triggerClass);
        setTimeout(() => el.classList.remove(triggerClass), 200);
    }
    
    async function startPlayback() {
        if (!isEngineOn) { await Tone.start(); isEngineOn = true; }
        if (isPlaying) return;
        Tone.Transport.start();
        isPlaying = true;
        startStopBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>';
        startStopBtn.classList.add('playing');
        if (grooveboix.activeBlockIndex > -1) { loadGrooveboixScene(grooveboix.activeBlockIndex); }
    }

    function stopPlayback() {
        if (!isPlaying) return;
        Tone.Transport.stop();
        isPlaying = false;
        clearAllActiveLoopsAndGrid();
        startStopBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>';
        startStopBtn.classList.remove('playing');
    }
    
    function updateBpm(newBpm) {
        const roundedBpm = Math.max(30, Math.min(300, Math.round(newBpm)));
        Tone.Transport.bpm.value = roundedBpm;
        bpmDisplay.textContent = roundedBpm;
    }

    function clearAllActiveLoopsAndGrid() {
        Object.values(grooveboix.activeParts[0]).forEach(part => part.stop(0).dispose());
        Object.values(grooveboix.activeParts[1]).forEach(part => part.stop(0).dispose());
        grooveboix.activeParts = { 0: {}, 1: {} };
        grooveboix.grid.querySelectorAll('.grid-cell').forEach(cell => cell.classList.remove('active-l1', 'active-l2', 'active-edit'));
    }

    // --- GROOVEBOIX LOGIC ---
    function createGrooveboixPart(pattern, note, cellElement, layer) {
        const events = pattern.split('').map((step, i) => step.toUpperCase() === 'X' ? { time: `0:0:${i}`, note, duration: '16n', element: cellElement, layer } : null).filter(Boolean);
        const part = new Tone.Part((time, value) => {
            grooveboix.synths[value.layer].triggerAttackRelease(value.note, value.duration, time);
            Tone.Draw.schedule(() => animateCellTrigger(value.element, 'grooveboix'), time);
        }, events);
        part.loop = true; part.loopEnd = '2m'; part.start(0);
        return part;
    }

    function updateGrooveboixPlaybackAndUI() {
        grooveboix.currentNotes = generateScale(grooveboix.currentRoot, grooveboix.currentScale, grooveboix.NUM_NOTES);
        populateGrooveboixGrid();
        if (!isPlaying) return;
        [0, 1].forEach(layer => {
            Object.keys(grooveboix.activeParts[layer]).forEach(partKey => {
                const [noteIndexStr, rhythmIndexStr] = partKey.split('-');
                const noteIndex = parseInt(noteIndexStr, 10), rhythmIndex = parseInt(rhythmIndexStr, 10);
                grooveboix.activeParts[layer][partKey].stop(0).dispose();
                const newNote = grooveboix.currentNotes[noteIndex];
                const pattern = grooveboix.RHYTHM_PATTERNS[rhythmIndex];
                const cellElement = grooveboix.grid.querySelector(`[data-note-index='${noteIndex}'][data-rhythm-index='${rhythmIndex}']`);
                if (newNote && cellElement) {
                    grooveboix.activeParts[layer][partKey] = createGrooveboixPart(pattern, newNote, cellElement, layer);
                }
            });
        });
    }

    function populateGrooveboixGrid() {
        grooveboix.grid.innerHTML = ''; grooveboix.labels.innerHTML = '';
        if (grooveboix.appMode === 'edit-rhythm') {
            for (let i = 0; i < grooveboix.NUM_STEPS; i++) grooveboix.labels.innerHTML += `<div class="grid-label">${i + 1}</div>`;
            for (let r = 0; r < grooveboix.NUM_RHYTHMS; r++) {
                for (let s = 0; s < grooveboix.NUM_STEPS; s++) {
                    const cell = document.createElement('div');
                    cell.className = `grid-cell ${grooveboix.RHYTHM_PATTERNS[r][s] === 'X' ? 'active-edit' : ''}`;
                    cell.dataset.rhythmIndex = r; cell.dataset.stepIndex = s;
                    grooveboix.grid.appendChild(cell);
                }
            }
        } else {
            grooveboix.currentNotes = generateScale(grooveboix.currentRoot, grooveboix.currentScale, grooveboix.NUM_NOTES);
            grooveboix.currentNotes.forEach(note => grooveboix.labels.innerHTML += `<div class="grid-label">${note.slice(0, -1)}</div>`);
            for (let r = 0; r < grooveboix.NUM_RHYTHMS; r++) {
                for (let n = 0; n < grooveboix.NUM_NOTES; n++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.dataset.noteIndex = n; cell.dataset.rhythmIndex = r;
                    grooveboix.grid.appendChild(cell);
                }
            }
            redrawGrooveboixGridState();
        }
    }
    
    async function toggleGrooveboixCell(cellElement) {
        if (grooveboix.appMode === 'edit-rhythm') {
            const r = parseInt(cellElement.dataset.rhythmIndex, 10), s = parseInt(cellElement.dataset.stepIndex, 10);
            let pArr = grooveboix.RHYTHM_PATTERNS[r].split('');
            pArr[s] = (pArr[s] === 'X') ? '_' : 'X';
            grooveboix.RHYTHM_PATTERNS[r] = pArr.join('');
            cellElement.classList.toggle('active-edit');
            updatePartsUsingRhythm(r);
            return;
        }
        if (!isEngineOn) { await startPlayback(); }
        const n = cellElement.dataset.noteIndex, r = cellElement.dataset.rhythmIndex;
        const key = `${n}-${r}`, layer = grooveboix.currentLayer;
        if (grooveboix.activeParts[layer][key]) {
            grooveboix.activeParts[layer][key].stop(0).dispose();
            delete grooveboix.activeParts[layer][key];
            cellElement.classList.remove(layer === 0 ? 'active-l1' : 'active-l2');
        } else {
            const note = grooveboix.currentNotes[n], pattern = grooveboix.RHYTHM_PATTERNS[r];
            if (note && pattern) {
                grooveboix.activeParts[layer][key] = createGrooveboixPart(pattern, note, cellElement, layer);
                cellElement.classList.add(layer === 0 ? 'active-l1' : 'active-l2');
            }
        }
        autoSaveGrooveboixScene();
    }

    function updatePartsUsingRhythm(rhythmIndex) {
        if (!isPlaying) return;
        [0, 1].forEach(layer => {
            Object.keys(grooveboix.activeParts[layer]).forEach(partKey => {
                const [noteIndexStr, rhythmIndexStr] = partKey.split('-');
                if (parseInt(rhythmIndexStr, 10) === rhythmIndex) {
                    grooveboix.activeParts[layer][partKey].stop(0).dispose();
                    const noteIndex = parseInt(noteIndexStr, 10);
                    const note = grooveboix.currentNotes[noteIndex];
                    const cellElement = grooveboix.grid.querySelector(`[data-note-index='${noteIndex}'][data-rhythm-index='${rhythmIndex}']`);
                    if (note && cellElement) {
                        grooveboix.activeParts[layer][partKey] = createGrooveboixPart(grooveboix.RHYTHM_PATTERNS[rhythmIndex], note, cellElement, layer);
                    }
                }
            });
        });
    }

    function redrawGrooveboixGridState() {
        if (grooveboix.appMode === 'edit-rhythm') { populateGrooveboixGrid(); return; }
        grooveboix.grid.querySelectorAll('.grid-cell').forEach(cell => {
            cell.classList.remove('active-l1', 'active-l2');
            const key = `${cell.dataset.noteIndex}-${cell.dataset.rhythmIndex}`;
            if (grooveboix.activeParts[0][key]) cell.classList.add('active-l1');
            if (grooveboix.activeParts[1][key]) cell.classList.add('active-l2');
        });
    }

    function setGrooveboixAppMode(newMode) {
        if (grooveboix.appMode === newMode) return;
        grooveboix.appMode = newMode;
        grooveboix.copyBtn.classList.toggle('active-copy', newMode === 'pasting');
        grooveboix.copyBtn.textContent = newMode === 'pasting' ? "Kies Doel" : "Kopieer";
        grooveboix.editRhythmBtn.classList.toggle('active', newMode === 'edit-rhythm');
        populateGrooveboixGrid();
    }

    function loadGrooveboixScene(index) {
        if (grooveboix.activeBlockIndex === index && grooveboix.appMode === 'normal') return;
        if (grooveboix.activeBlockIndex > -1) {
            document.querySelector(`.song-block[data-index='${grooveboix.activeBlockIndex}']`).classList.remove('active');
        }
        document.querySelector(`.song-block[data-index='${index}']`).classList.add('active');
        grooveboix.activeBlockIndex = index;
        if (!isPlaying) return;
        clearAllActiveLoopsAndGrid();
        const sceneData = grooveboix.songBlocks[index];
        if (sceneData) {
            [0, 1].forEach(layer => {
                if (sceneData[layer]) {
                    sceneData[layer].forEach(partKey => {
                        const [noteIndexStr, rhythmIndexStr] = partKey.split('-');
                        const cell = grooveboix.grid.querySelector(`[data-note-index='${noteIndexStr}'][data-rhythm-index='${rhythmIndexStr}']`);
                        if (cell) {
                            const note = grooveboix.currentNotes[noteIndexStr];
                            const pattern = grooveboix.RHYTHM_PATTERNS[rhythmIndexStr];
                            grooveboix.activeParts[layer][partKey] = createGrooveboixPart(pattern, note, cell, layer);
                        }
                    });
                }
            });
        }
        redrawGrooveboixGridState();
    }

    function autoSaveGrooveboixScene() {
        if (grooveboix.activeBlockIndex === -1) return;
        [0, 1].forEach(layer => {
            const activeCellKeys = new Set(Object.keys(grooveboix.activeParts[layer]));
            if (!grooveboix.songBlocks[grooveboix.activeBlockIndex]) grooveboix.songBlocks[grooveboix.activeBlockIndex] = {0: null, 1: null};
            grooveboix.songBlocks[grooveboix.activeBlockIndex][layer] = activeCellKeys;
        });
        document.querySelector(`.song-block[data-index='${grooveboix.activeBlockIndex}']`).classList.add('filled');
    }

    function generateScale(root, scale, num) {
        const intervals = grooveboix.SCALE_TYPES[scale];
        const notes = [];
        const rootIndex = grooveboix.ALL_NOTES.indexOf(root);
        let oct = 2;
        while(notes.length < num) {
            for (const interval of intervals) {
                const noteIndex = (rootIndex + interval) % 12;
                const currentOct = oct + Math.floor((rootIndex + interval) / 12);
                if (notes.length < num) notes.push(grooveboix.ALL_NOTES[noteIndex] + currentOct);
                else break;
            }
            oct++;
        }
        return notes;
    }

    function populateGrooveboixControls() {
        // Clear previous controls
        grooveboix.rootNoteControls.innerHTML = '';
        grooveboix.scaleTypeControls.innerHTML = '';
        grooveboix.waveformControlsL1.innerHTML = '';
        grooveboix.waveformControlsL2.innerHTML = '';
        grooveboix.layerControls.innerHTML = '';
        grooveboix.songModeContainer.innerHTML = '';

        grooveboix.ALL_NOTES.forEach(note => {
            const btn = document.createElement('button');
            btn.className = 'control-btn grooveboix-btn text-xs w-full'; btn.textContent = note;
            if (note === grooveboix.currentRoot) btn.classList.add('active');
            btn.addEventListener('click', () => {
                grooveboix.currentRoot = note;
                grooveboix.rootNoteControls.querySelector('.active').classList.remove('active');
                btn.classList.add('active'); updateGrooveboixPlaybackAndUI();
            });
            grooveboix.rootNoteControls.appendChild(btn);
        });
        Object.keys(grooveboix.SCALE_TYPES).forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'control-btn grooveboix-btn text-xs'; btn.textContent = name;
            if (name === grooveboix.currentScale) btn.classList.add('active');
            btn.addEventListener('click', () => {
                grooveboix.currentScale = name;
                grooveboix.scaleTypeControls.querySelector('.active').classList.remove('active');
                btn.classList.add('active'); updateGrooveboixPlaybackAndUI();
            });
            grooveboix.scaleTypeControls.appendChild(btn);
        });
        [grooveboix.waveformControlsL1, grooveboix.waveformControlsL2].forEach((container, layer) => {
            grooveboix.WAVEFORMS.forEach(wave => {
                const btn = document.createElement('button');
                btn.className = 'control-btn grooveboix-btn text-xs p-1'; btn.innerHTML = grooveboix.WAVEFORM_ICONS[wave];
                if (wave === grooveboix.layerWaveforms[layer]) btn.classList.add('active');
                btn.addEventListener('click', () => {
                    grooveboix.layerWaveforms[layer] = wave;
                    grooveboix.synths[layer].set({ oscillator: { type: wave } });
                    container.querySelector('.active').classList.remove('active'); btn.classList.add('active');
                });
                container.appendChild(btn);
            });
        });
        [1, 2].forEach((num, index) => {
            const btn = document.createElement('button');
            btn.className = 'control-btn grooveboix-btn text-xs px-3'; btn.textContent = `${num}`;
            if (index === grooveboix.currentLayer) btn.classList.add('active');
            btn.addEventListener('click', () => {
                if (grooveboix.currentLayer === index) return;
                grooveboix.currentLayer = index;
                grooveboix.layerControls.querySelector('.active').classList.remove('active');
                btn.classList.add('active'); redrawGrooveboixGridState();
            });
            grooveboix.layerControls.appendChild(btn);
        });
        for (let i = 0; i < 16; i++) {
            const block = document.createElement('button');
            block.className = 'song-block flex items-center justify-center text-xs';
            block.textContent = i + 1; block.dataset.index = i;
            block.addEventListener('click', () => {
                 if (grooveboix.appMode === 'pasting') {
                    if (grooveboix.copyBuffer) {
                        grooveboix.songBlocks[i] = { 0: new Set(grooveboix.copyBuffer[0]), 1: new Set(grooveboix.copyBuffer[1]) };
                        document.querySelector(`.song-block[data-index='${i}']`).classList.add('filled');
                        if (i === grooveboix.activeBlockIndex) loadGrooveboixScene(i);
                    }
                    setGrooveboixAppMode('normal');
                } else { loadGrooveboixScene(i); }
            });
            grooveboix.songModeContainer.appendChild(block);
        }
    }

    // --- DRUMBOINK LOGIC ---
    function selectDrumPattern(patternName) {
        if (drumboink.activePattern === patternName) {
            drumboink.activePattern = null;
        } else {
            drumboink.activePattern = patternName;
        }
        document.querySelectorAll('.drum-pattern-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.pattern === drumboink.activePattern);
        });
    }

    function triggerFill(fillName) {
        if (isPlaying && drumboink.fillStepCounter < 0) { // Prevent re-triggering a fill
            drumboink.fillQueued = fillName;
        }
    }

    function initializeDrumMachine() {
        // Create pattern buttons
        Object.keys(drumboink.PATTERNS).forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'control-btn drumbuddy-btn drum-pattern-btn';
            btn.textContent = name;
            btn.dataset.pattern = name;
            btn.addEventListener('click', () => selectDrumPattern(name));
            drumboink.buttonsContainer.appendChild(btn);
        });

        // Create fill buttons
        Object.keys(drumboink.FILLS).forEach((name, i) => {
            const btn = document.createElement('button');
            btn.className = 'control-btn drumbuddy-btn fill-btn';
            btn.textContent = i + 1;
            btn.dataset.fill = name;
            btn.addEventListener('click', () => triggerFill(name));
            drumboink.fillsContainer.appendChild(btn);
        });

        // Create the master sequence
        drumboink.sequence = new Tone.Sequence((time, step) => {
            if (step === 0 && drumboink.fillQueued) {
                drumboink.fillStepCounter = 0;
            }

            let pattern;
            let currentStep;

            if (drumboink.fillStepCounter >= 0) {
                pattern = drumboink.FILLS[drumboink.fillQueued];
                currentStep = drumboink.fillStepCounter;
            } else if (drumboink.activePattern) {
                pattern = drumboink.PATTERNS[drumboink.activePattern];
                currentStep = step;
            } else {
                return;
            }
            
            for (const soundName in pattern) {
                if (pattern[soundName][currentStep] === 'X') {
                    const synth = drumboink.SOUNDS[soundName];
                    if (!synth) continue;

                    if (synth.name === "MembraneSynth") {
                        const note = (soundName === 'KICK') ? 'C1' : 'G2';
                        synth.triggerAttackRelease(note, '8n', time);
                    } else if (synth.name === "NoiseSynth") {
                        synth.triggerAttackRelease('8n', time);
                    }
                }
            }

            if (drumboink.fillStepCounter >= 0) {
                drumboink.fillStepCounter++;
                if (drumboink.fillStepCounter >= 16) {
                    drumboink.fillStepCounter = -1;
                    drumboink.fillQueued = null;
                }
            }

        }, Array.from(Array(16).keys()), '16n').start(0);
    }

    // --- INITIALIZATION ---
    window.onload = () => {
        // Grooveboix Init
        populateGrooveboixControls();
        updateBpm(120);
        loadGrooveboixScene(0);
        populateGrooveboixGrid();

        // Drumboink Init
        initializeDrumMachine();
        
        // Global Listeners
        startStopBtn.addEventListener('click', () => isPlaying ? stopPlayback() : startPlayback());
        bpmUpBtn.addEventListener('click', () => updateBpm(Tone.Transport.bpm.value + 1));
        bpmDownBtn.addEventListener('click', () => updateBpm(Tone.Transport.bpm.value - 1));
        
        // Grooveboix Listeners
        grooveboix.grid.addEventListener('click', (e) => { 
            if (e.target.classList.contains('grid-cell')) toggleGrooveboixCell(e.target);
        });
        grooveboix.editRhythmBtn.addEventListener('click', () => {
            setGrooveboixAppMode(grooveboix.appMode === 'edit-rhythm' ? 'normal' : 'edit-rhythm');
        });
        grooveboix.copyBtn.addEventListener('click', () => {
            if (grooveboix.appMode === 'pasting') {
                setGrooveboixAppMode('normal');
                return;
            }
            if (grooveboix.activeBlockIndex > -1 && grooveboix.songBlocks[grooveboix.activeBlockIndex]) {
                grooveboix.copyBuffer = [
                    grooveboix.songBlocks[grooveboix.activeBlockIndex][0], 
                    grooveboix.songBlocks[grooveboix.activeBlockIndex][1]
                ];
                setGrooveboixAppMode('pasting');
            }
        });
        
        // Resize Handlers
        window.addEventListener('resize', () => {
            populateGrooveboixGrid();
        });
    };
</script>
