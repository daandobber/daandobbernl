<!DOCTYPE html>
<html lang="nl">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Synth</title>
    <!-- Tone.js bibliotheek -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            position: relative;
            border: 3px solid #f0f0f0;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #0c1e2e; /* Donkerblauwe achtergrond */
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Kliks gaan door naar de canvas eronder */
        }
        #start-screen, #game-over-screen {
            background: rgba(0, 0, 0, 0.75);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            pointer-events: auto; /* Knoppen zijn wel klikbaar */
            backdrop-filter: blur(5px);
            width: 80%;
        }
        #start-screen h2, #game-over-screen h2 {
            margin-top: 0;
            font-size: 2em;
        }
        #game-over-screen p {
            font-size: 1.2em;
            margin: 10px 0;
        }
        #score-display, #highscore-display {
            position: absolute;
            top: 15px;
            font-size: 28px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 5px #000;
        }
        #score-display { left: 15px; }
        #highscore-display { right: 15px; }

        .shape-btn {
            font-size: 3em;
            border: 2px solid #fff;
            background: none;
            color: #fff;
            margin: 0 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            width: 70px;
            height: 70px;
            border-radius: 10px;
        }
        .shape-btn:hover { background: #555; transform: scale(1.1); }
        .shape-btn.selected { background: #007BFF; border-color: #FFF; box-shadow: 0 0 15px #007BFF; }

        #mode-menu { margin-top: 20px; color: #fff; }
        #mode-menu label { margin: 0 10px; font-size: 1.1em; cursor: pointer; }

        .action-button {
            margin-top: 25px;
            padding: 12px 25px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            background-color: #28a745;
            color: white;
            transition: background-color 0.2s, opacity 0.2s;
        }
        .action-button:hover:not(:disabled) { background-color: #218838; }
        .action-button:disabled { background-color: #6c757d; cursor: not-allowed; opacity: 0.7; }
        
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="ui-overlay">
            <div id="start-screen">
                <h2>Flappy Synth</h2>
                <div id="shape-selector">
                    <button class="shape-btn" data-shape="sine">⬤</button>
                    <button class="shape-btn" data-shape="square">■</button>
                    <button class="shape-btn" data-shape="triangle">▲</button>
                </div>
                <div id="mode-menu">
                  <label><input type="radio" name="mode" value="normal" checked> Normaal</label>
                  <label><input type="radio" name="mode" value="god"> Chillmodus</label>
                </div>
                <button id="start-button" class="action-button" disabled>Aan het laden...</button>
            </div>
            <div id="game-over-screen" style="display: none;">
                <h2>Game Over</h2>
                <p id="final-score"></p>
                <p id="session-highscore"></p>
                <button id="restart-button" class="action-button">Probeer opnieuw</button>
            </div>
            <div id="score-display" style="display: none;">Score: 0</div>
            <div id="highscore-display" style="display: none;">High: 0</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- UI Elementen ---
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            const startScreen = document.getElementById('start-screen');
            const gameOverScreen = document.getElementById('game-over-screen');
            const startButton = document.getElementById('start-button');
            const restartButton = document.getElementById('restart-button');
            const shapeSelectors = document.querySelectorAll('.shape-btn');
            const scoreDisplay = document.getElementById('score-display');
            const highscoreDisplay = document.getElementById('highscore-display');
            const finalScoreEl = document.getElementById('final-score');
            const sessionHighscoreEl = document.getElementById('session-highscore');

            // --- Game State ---
            let gameStarted = false;
            let animationFrameId;
            let frame = 0;
            let score = 0;
            let highScore = 0;
            let gameMode = 'normal';
            const gravity = 0.25;
            const jumpStrength = -6;
            let lastObstacleX = 0;
            let lastTime = 0; // Voor het bijhouden van delta time

            // --- Speler Object ---
            const player = { x: 80, y: canvas.height / 2, size: 25, velocity: 0, shape: 'sine', rotation: 0 };
            let particles = [];
            
            // --- Gameplay Variabelen ---
            let obstacles = [];
            let collectibles = [];
            let gameSpeed = 2;
            let obstacleGap = 190;
            const obstacleInterval = 250; 

            // --- Visuele Effecten ---
            let starsFar = [];
            let starsNear = [];
            let currentPadHue = 210;

            // --- Audio ---
            let harpSynth, arpSynth, bass, padSynth, reverb, padFilter, rewardSynth, rewardDelay;
            let arpLoop, bassLoop, padLoop;
            let audioReady = false;
            let lastPlayedNote = null;
            let visualHarpStrings = [];

            // --- Muzikale Data ---
            const dreamyScale = ['C2', 'D2', 'E2', 'F#2', 'G2', 'A2', 'B2', 'C3', 'D3', 'E3', 'F#3', 'G3', 'A3', 'B3', 'C4', 'D4', 'E4', 'F#4', 'G4', 'A4', 'B4', 'C5', 'D5', 'E5', 'F#5', 'G5', 'A5', 'B5', 'C6'];
            const noteColors = { 'C': 0, 'D': 60, 'E': 120, 'F#': 180, 'G': 210, 'A': 270, 'B': 330 };

            // --- Initialisatie ---
            function setupInitialUI() {
                const currentSelected = document.querySelector('.shape-btn.selected')?.dataset.shape || 'sine';
                shapeSelectors.forEach(btn => {
                    btn.classList.remove('selected');
                    if (btn.dataset.shape === currentSelected) {
                        btn.classList.add('selected');
                    }
                });
                player.shape = currentSelected;
                startButton.disabled = false;
                startButton.textContent = 'Start Spel';
            }

            function initAudio() {
                if (audioReady) return Promise.resolve();
                return Tone.start().then(() => {
                    reverb = new Tone.Reverb({ decay: 4, wet: 0.2 }).toDestination();
                    
                    harpSynth = new Tone.PolySynth(Tone.Synth, { oscillator: { type: player.shape }, envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 1.5 } }).connect(reverb);
                    arpSynth = new Tone.PolySynth(Tone.FMSynth, {
                        harmonicity: 1.5,
                        modulationIndex: 10,
                        envelope: { attack: 0.2, decay: 0.1, sustain: 0.3, release: 1 },
                        modulationEnvelope: { attack: 0.2, decay: 0.1, sustain: 0.3, release: 1 }
                    }).toDestination();
                    bass = new Tone.MonoSynth({
                        oscillator: { type: 'sine' },
                        envelope: { attack: 0.1, decay: 0.3, sustain: 0.4, release: 1 },
                    }).toDestination();
                    padFilter = new Tone.AutoFilter({
                        frequency: "8n",
                        baseFrequency: 200,
                        octaves: 2
                    }).toDestination();
                    padSynth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: "fatsawtooth", count: 3, spread: 30 },
                        envelope: { attack: 2, decay: 1, sustain: 0.5, release: 4, attackCurve: 'exponential' }
                    }).connect(padFilter);
                    
                    rewardDelay = new Tone.FeedbackDelay("8n", 0.5).connect(reverb);
                    rewardSynth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: 'triangle' },
                        envelope: { attack: 0.01, decay: 0.5, sustain: 0.2, release: 2.5 }
                    }).connect(rewardDelay);

                    harpSynth.volume.value = -12;
                    arpSynth.volume.value = -18;
                    bass.volume.value = -14;
                    padSynth.volume.value = -22;
                    rewardSynth.volume.value = -14;
                    
                    audioReady = true;
                }).catch(error => console.error("Fout bij initialiseren van audio:", error));
            }

            // --- Tekenfuncties ---
            function createStars() {
                for(let i = 0; i < 25; i++) {
                    starsFar.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 1 });
                }
                for(let i = 0; i < 15; i++) {
                    starsNear.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 1.5 + 0.5 });
                }
            }

            function drawBackground(dt) {
                ctx.fillStyle = '#0c1e2e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const auroraGrad = ctx.createLinearGradient(0, 0, canvas.width, 0);
                auroraGrad.addColorStop(0, `hsla(${currentPadHue}, 50%, 20%, 0)`);
                auroraGrad.addColorStop(0.5, `hsla(${currentPadHue}, 50%, 20%, 0.3)`);
                auroraGrad.addColorStop(1, `hsla(${currentPadHue}, 50%, 20%, 0)`);
                ctx.fillStyle = auroraGrad;
                
                const bandHeight = canvas.height / 3;
                for (let i = 0; i < 3; i++) {
                    const xOffset = Math.sin(frame * 0.001 + i * 2) * 100;
                    ctx.fillRect(xOffset - 100, i * bandHeight + Math.sin(frame * 0.002 + i) * 20, canvas.width, bandHeight);
                }

                const updateStar = (star, speed) => {
                    star.x -= speed * dt; // Schaal beweging met dt
                    if (star.x < 0) {
                        star.x = canvas.width;
                        star.y = Math.random() * canvas.height;
                    }
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.fillRect(star.x, star.y, star.size, star.size);
                };
                starsFar.forEach(star => updateStar(star, gameSpeed * 0.1));
                starsNear.forEach(star => updateStar(star, gameSpeed * 0.3));
            }

            function drawHarpStrings() {
                visualHarpStrings.forEach(string => {
                    const isAnimating = string.animationTime > 0;
                    ctx.beginPath();
                    ctx.moveTo(0, string.y);
                    ctx.lineTo(canvas.width, string.y);
                    ctx.strokeStyle = `hsla(${string.colorHue}, 90%, 75%, ${isAnimating ? 0.8 : 0.2})`;
                    ctx.lineWidth = isAnimating ? 2.5 : 1;
                    ctx.stroke();
                    if (isAnimating) string.animationTime--;
                });
            }

            function drawPlayer(dt) {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x -= p.speed * dt; // Schaal beweging met dt
                    p.alpha -= 0.08;
                    if (p.alpha <= 0) {
                        particles.splice(i, 1);
                    } else {
                        ctx.fillStyle = `hsla(${p.hue}, 90%, 75%, ${p.alpha})`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.rotate(player.rotation);
                ctx.fillStyle = '#FFD700';
                ctx.strokeStyle = '#c7a000';
                ctx.lineWidth = 3;
                ctx.beginPath();
                if (player.shape === 'sine') ctx.arc(0, 0, player.size / 2, 0, Math.PI * 2);
                else if (player.shape === 'square') ctx.rect(-player.size / 2, -player.size / 2, player.size, player.size);
                else { ctx.moveTo(0, -player.size / 2); ctx.lineTo(-player.size / 2, player.size / 2); ctx.lineTo(player.size / 2, player.size / 2); ctx.closePath(); }
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }
            
            function updateAndDrawCollectibles(dt) {
                collectibles.forEach(c => {
                    if (!c.active) return;
                    c.x -= gameSpeed * dt; // Schaal beweging met dt
                    ctx.fillStyle = '#00f2ff';
                    ctx.shadowColor = '#00f2ff';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });
                collectibles = collectibles.filter(c => c.x + c.size > 0 && c.active);
            }
            
            // --- Muziek en Audio Logica ---
            function generateHarpScale() {
                const minFreq = Tone.Frequency(dreamyScale[0]).toFrequency();
                const maxFreq = Tone.Frequency(dreamyScale[dreamyScale.length - 1]).toFrequency();
                const logMin = Math.log(minFreq);
                const logMax = Math.log(maxFreq);
                const logRange = logMax - logMin;

                visualHarpStrings = dreamyScale.map(note => {
                    const freq = Tone.Frequency(note).toFrequency();
                    const logFreq = Math.log(freq);
                    const yRatio = (logFreq - logMin) / logRange;

                    return {
                        y: canvas.height * (1 - yRatio),
                        note: note,
                        colorHue: noteColors[note.replace(/[0-9]/g, '')] || 0,
                        animationTime: 0
                    };
                });
            }

            function setupMusic() {
                generateHarpScale();
                
                const arpNotes = ['C4', 'E4', 'G4', 'B4', 'D5', 'F#5', 'A5'];
                const bassNotes = ['C2', 'G2', 'D2', 'A2'];
                const padChords = [
                    { chord: ['C2', 'G2', 'B2', 'E3'], hue: 0 },
                    { chord: ['G2', 'D3', 'F#3', 'A3'], hue: 210 },
                    { chord: ['A2', 'C3', 'E3', 'G3'], hue: 270 }
                ];

                if (arpLoop) arpLoop.dispose();
                arpLoop = new Tone.Pattern((time, note) => {
                    if(arpSynth) arpSynth.triggerAttackRelease(note, "2n", time);
                }, arpNotes, "randomWalk").start(0);
                arpLoop.interval = '1n';
                
                if (bassLoop) bassLoop.dispose();
                bassLoop = new Tone.Pattern((time, note) => {
                    if(bass) bass.triggerAttackRelease(note, "1m", time);
                }, bassNotes, "up").start(0);
                bassLoop.interval = '1m';

                if (padLoop) padLoop.dispose();
                padLoop = new Tone.Sequence((time, item) => {
                    if(padSynth) padSynth.triggerAttackRelease(item.chord, "8n", time);
                }, padChords, "1m").start(0);

                if (padFilter) padFilter.start();
            }

            function playHarpNote() {
                if (!audioReady || !gameStarted || dreamyScale.length === 0) return;
                
                let closestNoteIndex = -1;
                let smallestDistance = Infinity;
                visualHarpStrings.forEach((string, index) => {
                    const distance = Math.abs(player.y - string.y);
                    if (distance < smallestDistance) {
                        smallestDistance = distance;
                        closestNoteIndex = index;
                    }
                });

                if (closestNoteIndex !== -1) {
                    const noteToPlay = visualHarpStrings[closestNoteIndex].note;
                    if (noteToPlay !== lastPlayedNote) {
                        if(harpSynth) harpSynth.triggerAttackRelease(noteToPlay, "8n");
                        lastPlayedNote = noteToPlay;
                        visualHarpStrings[closestNoteIndex].animationTime = 15;
                    }
                }
            }

            // --- Game Flow & Logica ---
            function jump() {
                if (gameStarted) {
                    player.velocity = jumpStrength;
                    player.rotation -= 0.5; 
                }
            }
            
            function generateElements() {
                if (canvas.width - lastObstacleX > obstacleInterval) {
                    const yCenter = canvas.height / 2;
                    const newObstacle = { x: canvas.width, currentY: yCenter, passed: false, waveOffset: Math.random() * Math.PI * 2 };
                    obstacles.push(newObstacle);
                    lastObstacleX = newObstacle.x;
                    
                    if (Math.random() > 0.4) {
                        collectibles.push({
                            x: newObstacle.x + obstacleInterval / 2,
                            y: 40 + Math.random() * (canvas.height - 80),
                            size: 8,
                            active: true
                        });
                    }
                }
            }
            
            function updateAndDrawObstacles(dt) {
                obstacles.forEach(obstacle => {
                    obstacle.x -= gameSpeed * dt; // Schaal beweging met dt
                    
                    const waveAmplitude = 80;
                    const waveFrequency = 0.005;
                    const verticalOffset = Math.sin(frame * waveFrequency + obstacle.waveOffset) * waveAmplitude;
                    const gapCenterY = (canvas.height / 2) + verticalOffset;
                    const topPipeHeight = gapCenterY - (obstacleGap / 2);
                    const bottomPipeY = gapCenterY + (obstacleGap / 2);
                    
                    obstacle.topHeight = topPipeHeight;
                    obstacle.bottomY = bottomPipeY;
                    
                    ctx.fillStyle = '#1e3a5f';
                    ctx.fillRect(obstacle.x, 0, 60, topPipeHeight);
                    ctx.fillRect(obstacle.x, bottomPipeY, 60, canvas.height - bottomPipeY);

                    ctx.shadowColor = 'hsl(210, 100%, 75%)';
                    ctx.shadowBlur = 5;
                    ctx.strokeStyle = 'hsl(210, 100%, 85%)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(obstacle.x, 0, 60, topPipeHeight);
                    ctx.strokeRect(obstacle.x, bottomPipeY, 60, canvas.height - bottomPipeY);
                    ctx.shadowBlur = 0;
                });
                if (obstacles.length > 0) lastObstacleX = obstacles[obstacles.length - 1].x;
                obstacles = obstacles.filter(o => o.x + 60 > 0);
            }

            function checkCollisions() {
                if (gameMode === "god") return false;
                if (player.y + player.size / 2 > canvas.height || player.y - player.size / 2 < 0) return true;

                for (const obs of obstacles) {
                    if (player.x + player.size/2 > obs.x && player.x - player.size/2 < obs.x + 60) {
                        if (player.y - player.size/2 < obs.topHeight || player.y + player.size/2 > obs.bottomY) return true;
                    }
                }

                for (const c of collectibles) {
                    if (c.active && Math.hypot(player.x - c.x, player.y - c.y) < player.size / 2 + c.size) {
                        c.active = false;
                        score++;
                        scoreDisplay.textContent = `Score: ${score}`;
                        
                        if (rewardSynth) {
                            const now = Tone.now();
                            const rootNote = ['C5', 'E5', 'G5', 'A5', 'C6'][Math.floor(Math.random() * 5)];
                            rewardSynth.triggerAttackRelease(rootNote, '2n', now);
                        }
                    }
                }
                return false;
            }
            
            function updateScoreAndDifficulty() {
                for (const obs of obstacles) {
                    if (obs.x + 60 < player.x && !obs.passed) {
                        obs.passed = true;
                        score++;
                        scoreDisplay.textContent = `Score: ${score}`;
                        gameSpeed = Math.min(4, 2 + score * 0.05);
                        obstacleGap = Math.max(140, 190 - score * 1);
                        if (reverb) reverb.wet.value = Math.min(0.6, 0.2 + score * 0.01);
                    }
                }
            }
            
            function gameLoop() {
                const now = performance.now();
                // Bereken dt, de factor om beweging mee te schalen zodat het onafhankelijk is van de frame rate.
                // dt is 1 bij 60fps. Bij 120fps is het 0.5, dus updates worden gehalveerd om te compenseren.
                // Gekapt op 3 om enorme sprongen te voorkomen als de tab focus verliest.
                const dt = Math.min(3, (now - lastTime) / (1000 / 60));
                lastTime = now;

                frame++;
                player.velocity += gravity * dt;
                player.y += player.velocity * dt;
                player.rotation = Math.min(0.8, player.rotation + 0.02 * dt);
                
                const lastNote = visualHarpStrings.find(s => s.note === lastPlayedNote);
                const particleHue = lastNote ? lastNote.colorHue : 210;
                particles.push({ x: player.x, y: player.y, size: Math.random() * 2 + 1, speed: Math.random() * 1 + 1, alpha: 1, hue: particleHue });

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Geef dt door aan functies die het nodig hebben
                drawBackground(dt);
                drawHarpStrings();
                updateAndDrawObstacles(dt);
                updateAndDrawCollectibles(dt);
                drawPlayer(dt);
                
                generateElements();
                playHarpNote();
                updateScoreAndDifficulty();
                
                if (checkCollisions()) {
                    gameOver();
                    return;
                }
                
                animationFrameId = requestAnimationFrame(gameLoop);
            }

            function startGameLogic() {
                gameStarted = true;
                player.y = canvas.height / 2;
                player.velocity = 0;
                player.rotation = 0;
                score = 0;
                frame = 0;
                gameSpeed = 2;
                obstacleGap = 190;
                lastObstacleX = 0;
                obstacles = [];
                collectibles = [];
                if (reverb) reverb.wet.value = 0.2;
                
                gameMode = document.querySelector('input[name="mode"]:checked').value;
                
                startScreen.style.display = 'none';
                gameOverScreen.style.display = 'none';
                scoreDisplay.style.display = 'block';
                highscoreDisplay.style.display = 'block';
                scoreDisplay.textContent = `Score: 0`;
                highscoreDisplay.textContent = `High: ${highScore}`;

                setupMusic();
                Tone.Transport.start();
                
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                
                // Reset de timer aan het begin van het spel
                lastTime = performance.now();
                gameLoop();
            }

            function gameOver() {
                gameStarted = false;
                cancelAnimationFrame(animationFrameId);
                Tone.Transport.stop();
                Tone.Transport.cancel(0);
                
                if (arpLoop) { arpLoop.dispose(); arpLoop = null; }
                if (bassLoop) { bassLoop.dispose(); bassLoop = null; }
                if (padLoop) { padLoop.dispose(); padLoop = null; }
                if (padFilter) { padFilter.stop(); }

                if (score > highScore) highScore = score;

                finalScoreEl.textContent = `Jouw Score: ${score}`;
                sessionHighscoreEl.textContent = `High Score: ${highScore}`;
                scoreDisplay.style.display = 'none';
                highscoreDisplay.style.display = 'none';
                gameOverScreen.style.display = 'flex';
            }

            // --- Event Listeners ---
            startButton.addEventListener('click', () => {
                if (!audioReady) {
                    initAudio().then(startGameLogic);
                } else {
                    startGameLogic();
                }
            });
            restartButton.addEventListener('click', () => {
                gameOverScreen.style.display = 'none';
                startScreen.style.display = 'flex';
                setupInitialUI();
            });
            shapeSelectors.forEach(button => {
                button.addEventListener('click', () => {
                    shapeSelectors.forEach(btn => btn.classList.remove('selected'));
                    button.classList.add('selected');

                    player.shape = button.dataset.shape;
                    if (harpSynth) {
                        harpSynth.set({ oscillator: { type: player.shape } });
                        if (player.shape === 'square') {
                            harpSynth.volume.value = -18;
                        } else {
                            harpSynth.volume.value = -12;
                        }
                    }
                });
            });
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'ArrowUp') {
                    e.preventDefault();
                    jump();
                }
            });
            canvas.addEventListener('mousedown', jump);
            
            setupInitialUI();
            createStars();
            initAudio();
        });
    </script>

</body>
</html>
