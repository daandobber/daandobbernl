<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blokken</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --panel-bg: rgba(28, 28, 30, 0.75);
            --border-color: rgba(255, 255, 255, 0.15);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --button-bg: rgba(255, 255, 255, 0.1);
            --button-hover-bg: rgba(255, 255, 255, 0.2);
        }

        body { 
            font-family: 'VT323', monospace;
            background-color: #000000;
            overflow: hidden;
            -webkit-font-smoothing: none;
            font-size: 18px;
            color: var(--text-primary);
        }
        #visualizerCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #ui-container {
            position: fixed;
            z-index: 10;
            display: flex;
            transition: all 0.5s ease-in-out;
        }
        
        #ui-container.is-centered {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
        }
        #ui-container.is-centered #toggleButton {
            display: none;
        }
        
        #ui-container:not(.is-centered) {
            bottom: 1.5rem;
            right: 1.5rem;
            flex-direction: column;
            align-items: flex-end;
        }

        /* Modern Glassmorphic Styling */
        #controls-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            max-height: 85vh; /* Prevents panel from being too tall */
            display: flex;
            flex-direction: column;
        }
        
        #controls {
            overflow-y: auto; /* Allows content to scroll */
        }

        #ui-container:not(.is-centered) #controls-panel {
             margin-bottom: 1rem;
        }
        #controls-panel.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        .modern-button {
            background: var(--button-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-primary);
            transition: background-color 0.2s ease;
            cursor: pointer;
        }
        .modern-button:hover {
            background: var(--button-hover-bg);
        }
        .modern-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #toggleButton {
            z-index: 11;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #toggleButton svg {
            width: 24px;
            height: 24px;
        }

        /* Slider Styles */
        .control-group label {
            color: var(--text-secondary);
        }
        .control-group span {
            color: var(--text-primary);
            font-weight: bold;
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 20px;
            background: transparent;
            outline: none;
            margin-top: 4px;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 3px;
        }
        input[type="range"]::-moz-range-track {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 3px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            margin-top: -6px;
            width: 18px;
            height: 18px;
            background: var(--text-primary);
            cursor: pointer;
            border-radius: 50%;
        }
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: var(--text-primary);
            cursor: pointer;
            border-radius: 50%;
            border: none;
        }
    </style>
</head>
<body>

    <canvas id="visualizerCanvas"></canvas>

    <div id="ui-container" class="is-centered">
        <!-- Main Controls Panel -->
        <div id="controls-panel" class="p-6 sm:p-8 w-[90vw] max-w-lg">
            
            <div id="controls" class="space-y-4 p-2">
                <!-- Grouped Parameters -->
                <div class="grid grid-cols-2 gap-x-4">
                    <div class="control-group">
                        <label for="fmTimbre">Klankkleur: <span id="fmTimbreValue">0.0</span></label>
                        <input type="range" id="fmTimbre" min="0" max="10" value="0" step="0.1">
                    </div>
                     <div class="control-group">
                        <label for="fmModDepth">Mod Depth: <span id="fmModDepthValue">0.0</span></label>
                        <input type="range" id="fmModDepth" min="0" max="2.0" value="0" step="0.05">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-x-4">
                    <div class="control-group">
                        <label for="attackTime">Attack: <span id="attackTimeValue">0.2</span></label>
                        <input type="range" id="attackTime" min="0.01" max="1.0" value="0.2" step="0.01">
                    </div>
                     <div class="control-group">
                        <label for="releaseTime">Release: <span id="releaseTimeValue">3.0</span></label>
                        <input type="range" id="releaseTime" min="0.1" max="5.0" value="3.0" step="0.1">
                    </div>
                </div>
                 <div class="grid grid-cols-2 gap-x-4">
                    <div class="control-group">
                        <label for="nDelayChains">Echo's: <span id="nDelayChainsValue">2</span></label>
                        <input type="range" id="nDelayChains" min="0" max="8" value="2" step="1">
                    </div>
                     <div class="control-group">
                        <label for="reverb">Galm: <span id="reverbValue">0.5</span></label>
                        <input type="range" id="reverb" min="0" max="1" value="0.5" step="0.05">
                    </div>
                </div>

                <!-- Single Parameters -->
                <div class="control-group pt-2">
                    <label for="fundamental">Grondtoon (Hz): <span id="fundamentalValue">110</span></label>
                    <input type="range" id="fundamental" min="50" max="440" value="110" step="1">
                </div>
                 <div class="control-group">
                    <label for="noteSpread">Noot Spreiding: <span id="noteSpreadValue">2</span></label>
                    <input type="range" id="noteSpread" min="1" max="5" value="2" step="1">
                </div>
                <div class="control-group">
                    <label for="patternLength">Patroonlengte: <span id="patternLengthValue">4</span></label>
                    <input type="range" id="patternLength" min="1" max="16" value="4" step="1">
                </div>
                <div class="control-group">
                    <label for="bpm">BPM: <span id="bpmValue">90</span></label>
                    <input type="range" id="bpm" min="30" max="240" value="90" step="1">
                </div>
            </div>

            <div class="flex justify-center space-x-4 mt-6 p-2">
                <button id="playPauseButton" class="modern-button flex-1">Play</button>
                <button id="randomizeButton" class="modern-button flex-1">Randomize</button>
                <button id="stopButton" class="modern-button flex-1">Stop</button>
            </div>
        </div>

        <!-- Toggle Button -->
        <button id="toggleButton" class="modern-button">
            <svg id="icon-minimize" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
            </svg>
            <svg id="icon-maximize" xmlns="http://www.w3.org/2000/svg" class="hidden" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />
            </svg>
        </button>
    </div>

    <script type="module">
        // --- UTILITY CLASSES ---
        class Random {
            static float(min, max) { return Math.random() * (max - min) + min; }
            static int(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
            static select(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
            static coinToss(probability = 0.5) { return Math.random() < probability; }
        }
        
        function mapValue(value, inMin, inMax, outMin, outMax) {
            return (value - inMin) * (outMax - outMin) / (inMax - inMin) + outMin;
        }

        // --- VISUALIZER SETUP ---
        const canvas = document.getElementById('visualizerCanvas');
        const canvasCtx = canvas.getContext('2d');
        let visualizerAnimationId;
        const GRID_SIZE = 25;
        let grid = [];
        let cols, rows;
        let currentBaseHue = 0;

        function setupGrid() {
            cols = Math.ceil(canvas.width / GRID_SIZE);
            rows = Math.ceil(canvas.height / GRID_SIZE);
            grid = [];
            for (let i = 0; i < cols; i++) {
                grid[i] = [];
                for (let j = 0; j < rows; j++) {
                    grid[i][j] = { life: 0, hue: 0, saturation: 0, lightness: 0, fadeSpeed: 0.01 };
                }
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            setupGrid();
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // --- TONE.JS APPLICATIE ---
        let isSetup = false;
        let synth, notePart, reverb, masterVolume;
        let delays = [];

        const uiContainer = document.getElementById('ui-container');
        const playPauseButton = document.getElementById('playPauseButton');
        const stopButton = document.getElementById('stopButton');
        const randomizeButton = document.getElementById('randomizeButton');
        const toggleButton = document.getElementById('toggleButton');
        const controlsPanel = document.getElementById('controls-panel');
        const iconMinimize = document.getElementById('icon-minimize');
        const iconMaximize = document.getElementById('icon-maximize');

        // --- UI TOGGLE LOGIC ---
        toggleButton.addEventListener('click', (e) => {
            e.stopPropagation(); 
            controlsPanel.classList.toggle('hidden');
            iconMinimize.classList.toggle('hidden');
            iconMaximize.classList.toggle('hidden');
        });
        
        window.addEventListener('click', (event) => {
            const isPanelOpen = !controlsPanel.classList.contains('hidden');
            const isUICornered = !uiContainer.classList.contains('is-centered');

            if (isPanelOpen && isUICornered) {
                if (!controlsPanel.contains(event.target) && !toggleButton.contains(event.target)) {
                    controlsPanel.classList.add('hidden');
                    iconMinimize.classList.remove('hidden');
                    iconMaximize.classList.add('hidden');
                }
            }
        });


        // --- Hoofdfuncties ---
        async function setupAndPlay() {
            if (Tone.context.state !== 'running') {
                await Tone.start();
            }
            
            await generateSoundscape();
            Tone.Transport.start();
            isSetup = true;
            playPauseButton.textContent = 'Pause';
        }

        function cleanupAudio(fullCleanup = false) {
            if (notePart) {
                notePart.stop(0).dispose();
                notePart = null;
            }
            
            if (synth) {
                synth.releaseAll();
                synth.disconnect();
                if (fullCleanup) {
                    synth.dispose();
                    synth = null;
                }
            }

            [...delays, reverb, masterVolume].forEach(node => {
                if (node && !node.disposed) {
                    node.disconnect();
                    node.dispose();
                }
            });
            delays = [];
            reverb = null;
            masterVolume = null;
        }

        async function generateSoundscape() {
            const params = getUIParams();
            
            if (isSetup) {
                 cleanupAudio(false);
            }

            currentBaseHue = mapValue(params.fundamental, 50, 440, 0, 240);
            
            if (!synth || synth.disposed) {
                 synth = new Tone.PolySynth(Tone.FMSynth).toDestination();
            }
            
            const harmonicity = mapValue(params.fmTimbre, 0, 10, 1, 4);
            const modulationIndex = mapValue(params.fmTimbre, 0, 10, 0, 20);
            
            synth.set({ 
                harmonicity, 
                modulationIndex,
                envelope: { 
                    attack: params.attackTime, 
                    decay: 1.5, 
                    sustain: 0.1, 
                    release: params.releaseTime 
                },
                modulationEnvelope: {
                    attack: 0.01,
                    decay: params.fmModDepth,
                    sustain: 1,
                    release: 0.5
                }
            });

            reverb = new Tone.Reverb({ decay: 8, preDelay: 0.01, wet: params.reverbWet }).toDestination();
            delays = Array.from({ length: params.nDelayChains }, () => 
                new Tone.FeedbackDelay({
                    delayTime: Random.select(["8n", "4n.", "4n"]),
                    feedback: Random.float(0.2, 0.5),
                    wet: Random.float(0.2, 0.45)
                }).connect(reverb)
            );
            masterVolume = new Tone.Volume(-18);
            
            synth.connect(masterVolume);
            masterVolume.connect(reverb);
            delays.forEach(delay => masterVolume.connect(delay));
            
            const allNotes = generateRandomPattern(params);
            notePart = new Tone.Part((time, value) => {
                if (Tone.Transport.state === 'started' && synth && !synth.disposed) {
                    synth.triggerAttackRelease(value.note, value.duration, time, value.velocity);
                    triggerGridPattern(value.velocity);
                }
            }, allNotes).start(0);
            
            notePart.loop = true;
            notePart.loopEnd = `${params.patternLength}m`;
            
            Tone.Transport.bpm.value = params.bpm;
        }

        function generateRandomPattern(params) {
            const scaleRatios = [1, 9/8, 5/4, 3/2, 5/3];
            const octaveChoices = {
                1: [1],
                2: [0.5, 1],
                3: [0.5, 1, 2],
                4: [0.25, 0.5, 1, 2],
                5: [0.25, 0.5, 1, 2, 4]
            };
            const octaves = octaveChoices[params.noteSpread];
            const rhythmicMotifs = [ [0.5, 0.25, 0.25], [0.25, 0.25, 0.5], [1], [0.5, 0.5], [0.25, 0.75] ];
            
            const totalBeats = params.patternLength * 4;
            let currentBeat = 0;
            let allNotes = [];
            
            while (currentBeat < totalBeats) {
                const motif = Random.select(rhythmicMotifs);
                for (const durationInBeats of motif) {
                    if (currentBeat >= totalBeats) break;
                    
                    if (Random.coinToss(0.65)) {
                        const measure = Math.floor(currentBeat / 4);
                        const quarter = Math.floor(currentBeat % 4);
                        const sixteenth = Math.floor((currentBeat * 4) % 4);
                        const noteTime = `${measure}:${quarter}:${sixteenth}`;

                        if (Random.coinToss(0.15)) {
                            const rootRatio = Random.select(scaleRatios);
                             for (let j = 0; j < Random.int(2, 3); j++) {
                                const ratio = scaleRatios[(scaleRatios.indexOf(rootRatio) + j * 2) % scaleRatios.length];
                                allNotes.push({ time: noteTime, note: params.fundamental * ratio * Random.select(octaves), duration: "16n", velocity: Random.float(0.1, 0.4) });
                            }
                        } else {
                             allNotes.push({ time: noteTime, note: params.fundamental * Random.select(scaleRatios) * Random.select(octaves), duration: Random.select(["8n", "4n"]), velocity: Random.float(0.2, 0.7) });
                        }
                    }
                    currentBeat += durationInBeats;
                }
            }
            return allNotes;
        }

        function getUIParams() {
            return {
                fmTimbre: parseFloat(document.getElementById('fmTimbre').value),
                fmModDepth: parseFloat(document.getElementById('fmModDepth').value),
                attackTime: parseFloat(document.getElementById('attackTime').value),
                releaseTime: parseFloat(document.getElementById('releaseTime').value),
                fundamental: parseFloat(document.getElementById('fundamental').value),
                noteSpread: parseInt(document.getElementById('noteSpread').value),
                patternLength: parseInt(document.getElementById('patternLength').value),
                nDelayChains: parseInt(document.getElementById('nDelayChains').value),
                bpm: parseInt(document.getElementById('bpm').value),
                reverbWet: parseFloat(document.getElementById('reverb').value),
            };
        }

        // --- Event Handlers ---
        playPauseButton.addEventListener('click', async () => {
            if (!isSetup) {
                if (uiContainer.classList.contains('is-centered')) {
                    uiContainer.classList.remove('is-centered');
                    controlsPanel.classList.add('hidden');
                    iconMinimize.classList.remove('hidden');
                    iconMaximize.classList.add('hidden');
                }
                await setupAndPlay();
            } else if (Tone.Transport.state === 'started') {
                Tone.Transport.pause();
                playPauseButton.textContent = 'Play';
            } else {
                Tone.Transport.start();
                playPauseButton.textContent = 'Pause';
            }
        });

        stopButton.addEventListener('click', () => {
            if (!isSetup) return;
            Tone.Transport.stop();
            cleanupAudio(true);
            isSetup = false;
            playPauseButton.textContent = 'Play';

            if (!uiContainer.classList.contains('is-centered')) {
                uiContainer.classList.add('is-centered');
                controlsPanel.classList.remove('hidden');
                iconMinimize.classList.remove('hidden');
                iconMaximize.classList.add('hidden');
            }
        });
        
        function updateSlider(id, value, decimals = 0) {
            const slider = document.getElementById(id);
            const display = document.getElementById(`${id}Value`);
            slider.value = value;
            display.textContent = value.toFixed(decimals);
        }

        function randomizeParameters() {
            updateSlider('attackTime', Random.float(0.01, 1.0), 2);
            updateSlider('releaseTime', Random.float(0.1, 5.0), 1);
            const newFundamental = Random.int(50, 320);
            updateSlider('fundamental', newFundamental, 0);
            updateSlider('nDelayChains', Random.int(0, 3), 0);
            updateSlider('reverb', Random.float(0.0, 0.5), 2);
            updateSlider('bpm', Random.int(70, 150), 0);
            updateSlider('patternLength', Random.select([2, 4, 8, 16]), 0);
            
            currentBaseHue = mapValue(newFundamental, 50, 440, 0, 240);
        }

        randomizeButton.addEventListener('click', () => {
            randomizeParameters();
            if (isSetup) {
                generateSoundscape();
            }
        });

        // --- Real-time Parameter Updates ---
        ['fmTimbre', 'fmModDepth', 'attackTime', 'releaseTime', 'fundamental', 'noteSpread', 'patternLength', 'nDelayChains', 'bpm', 'reverb'].forEach(id => {
            const slider = document.getElementById(id);
            const display = document.getElementById(`${id}Value`);
            
            const updateFunction = (e) => {
                const value = e.target.value;
                const decimals = slider.step.includes('.') ? slider.step.split('.')[1].length : 0;
                display.textContent = parseFloat(value).toFixed(decimals);

                if (isSetup) {
                    switch(id) {
                        case 'fmTimbre':
                            if (synth) synth.set({ modulationIndex: mapValue(value, 0, 10, 0, 20) });
                            break;
                        case 'fmModDepth':
                             if (synth) synth.set({ modulationEnvelope: { decay: value } });
                            break;
                        case 'attackTime':
                             if (synth) synth.set({ envelope: { attack: value } });
                            break;
                        case 'releaseTime':
                             if (synth) synth.set({ envelope: { release: value } });
                            break;
                        case 'reverb':
                            if (reverb) reverb.wet.value = value;
                            break;
                        case 'bpm':
                             Tone.Transport.bpm.value = value;
                            break;
                    }
                }
            };
            
            const rebuildFunction = () => {
                if (id === 'fundamental') {
                     currentBaseHue = mapValue(slider.value, 50, 440, 0, 240);
                }
                if (isSetup) {
                    generateSoundscape();
                }
            }

            slider.addEventListener('input', updateFunction);
            if(['fundamental', 'nDelayChains', 'patternLength', 'noteSpread'].includes(id)){
                slider.addEventListener('change', rebuildFunction);
            }
        });

        // --- Visualizer Functies ---
        function triggerGridPattern(velocity = 1.0) {
            const eventType = Math.random();
            const hue = (currentBaseHue + Random.float(-20, 20) + 360) % 360;
            const saturation = Random.float(50, 65); 
            const lightness = Random.float(60, 70);
            const fadeSpeed = mapValue(velocity, 0.1, 0.7, 0.015, 0.005);

            if (eventType < 0.05) { // Full screen wash
                for (let i = 0; i < cols; i++) {
                    for (let j = 0; j < rows; j++) {
                        const cell = grid[i][j];
                        if (cell.life <= 0.1) {
                            cell.life = Math.min(0.25, cell.life + velocity * 0.3);
                            cell.hue = hue;
                            cell.saturation = 30;
                            cell.lightness = 40;
                            cell.fadeSpeed = 0.004;
                        }
                    }
                }
                return;
            }

            const midX = Math.ceil(cols / 2), midY = Math.ceil(rows / 2);
            const w = Random.int(3, cols / 2);
            const h = Random.int(1, 3);
            const sx = Random.int(0, midX - w), sy = Random.int(0, midY - h);
            
            for(let x = sx; x < sx + w; x++) {
                for (let y = sy; y < sy + h; y++) {
                     if (grid[x] && grid[x][y]) {
                        const cellsToUpdate = [
                            grid[x][y],
                            grid[cols - 1 - x][y],
                            grid[x][rows - 1 - y],
                            grid[cols - 1 - x][rows - 1 - y]
                        ];
                        cellsToUpdate.forEach(cell => {
                            if (cell) {
                                cell.life = Math.min(1.5, cell.life + velocity * 0.8);
                                cell.hue = hue;
                                cell.saturation = saturation;
                                cell.lightness = lightness;
                                cell.fadeSpeed = fadeSpeed;
                            }
                        });
                    }
                }
            }
        }

        function drawVisualizer() {
            visualizerAnimationId = requestAnimationFrame(drawVisualizer);
            
            canvasCtx.fillStyle = `hsla(${currentBaseHue}, 50%, 10%, 1)`;
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            
            canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (isSetup) {
                for (let i = 0; i < cols; i++) {
                    for (let j = 0; j < rows; j++) {
                        const cell = grid[i][j];
                        if (cell.life > 0) {
                            cell.life -= cell.fadeSpeed; 
                            canvasCtx.fillStyle = `hsla(${cell.hue}, ${cell.saturation}%, ${cell.lightness}%, ${cell.life})`;
                            canvasCtx.fillRect(i * GRID_SIZE, j * GRID_SIZE, GRID_SIZE, GRID_SIZE);
                        } else {
                            cell.life = 0;
                        }
                    }
                }
            }
        }

        // Initial randomization and start drawing loop on load
        randomizeParameters();
        drawVisualizer();
        
    </script>
</body>
</html>
